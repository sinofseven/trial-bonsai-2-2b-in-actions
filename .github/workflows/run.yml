on:
  push:
    
env:
  URL: "https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10777-e3de715/llama-prism-b10777-e3de715-bin-ubuntu-x64.tar.gz"

jobs: 
  run:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir bin
          
          curl "$URL" -o data.tar.gz -L
          tar -xzf data.tar.gz -C bin --strip-components=1
      - run: |
          ./bin/llama-cli -m Ternary-Bonsai-2-2B-PQ2_0.gguf -ngl 99 -fa on \
            -p "Explain in three sentences why the sky is blue."
